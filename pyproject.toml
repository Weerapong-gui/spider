[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spider"
version = "0.1.0"
description = "Personal cross-machine text and file transfer"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3.0"]

[project.optional-dependencies]
server = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
    "python-multipart>=0.0.9,<1.0",
]
cli = [
    "typer>=0.12,<1.0",
    "httpx>=0.27,<1.0",
    "rich>=13.7,<15.0",
    "pyperclip>=1.9,<2.0",
]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-cov>=5.0,<7.0",
    "hypothesis>=6.100,<7.0",
    "ruff>=0.5,<1.0",
]

[project.scripts]
spider = "spider.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"spider.server" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S311"]
